plugins {
    id 'java-library'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven {
        url "https://libraries.minecraft.net"
    }
}

configurations {
    testImplementation.extendsFrom compileOnly
}

dependencies {
    compileOnly 'com.google.code.gson:gson:2.13.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'com.mojang:brigadier:1.0.18'
    // Match the Adventure API provided by our oldest supported Paper server.
    implementation 'net.kyori:adventure-text-minimessage:4.18.0'
    implementation 'net.kyori:adventure-text-serializer-plain:4.18.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.0'
    testImplementation 'net.kyori:adventure-text-serializer-legacy:4.18.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
